services:
  smoggle:
    build: .
    container_name: smoggle
    ports:
      - "7420:7420"
    volumes:
      # Smoggle generates and stores its own managed SSH identity key here on
      # first boot (backend/ssh_identity.py), so no host key mount is needed.
      - smoggle_data:/app/data
    environment:
      - DEPLOY_MODE=remote
    # The entrypoint fixes data-volume ownership then drops to the unprivileged
    # 'smoggle' user via gosu, so the app process runs non-root. Drop all caps
    # except the few the root entrypoint needs to chown the volume (CHOWN/
    # DAC_OVERRIDE/FOWNER) and drop privileges (SETUID/SETGID).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7420/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  smoggle_data: