services:
  smoggle:
    build: .
    container_name: smoggle
    ports:
      - "7420:7420"
    volumes:
      # Smoggle generates and stores its own managed SSH identity key here on
      # first boot (backend/ssh_identity.py), so no host key mount is needed.
      - smoggle_data:/app/data
    environment:
      - DEPLOY_MODE=remote
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7420/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  smoggle_data: