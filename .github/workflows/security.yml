name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python deps + SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanners
        run: pip install pip-audit bandit
      # Allowlisted CVEs (deliberate, tracked — see SECURITY.md "Known issues"):
      #  - CVE-2026-44405 (paramiko): no fixed version published yet.
      - name: pip-audit (backend dependencies)
        run: |
          pip-audit -r backend/requirements.txt \
            --ignore-vuln CVE-2026-44405
      - name: bandit (Python SAST)
        run: bandit -r backend -ll -ii

  node:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      # Fail on high+ — no current allowlisted advisories (see SECURITY.md).
      - name: npm audit (high+)
        run: npx --yes audit-ci@^7 --high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
